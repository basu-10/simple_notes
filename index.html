<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8e8e6">
<title>Plainnote</title>
<style>
:root{
  --bg:#e7e7e4;--surface:#e9e9e7;--surface-hi:#f1f1ef;--surface-lo:#dcdcd9;
  --text:#202122;--muted:#777878;--faint:#a0a19f;--line:rgba(30,31,31,.10);
  --shadow-hi:rgba(255,255,255,.94);--shadow-lo:rgba(72,73,72,.18);
  --radius:22px;--radius-sm:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #8f908f;outline-offset:2px}
.app{
  width:100vw;height:100vh;padding:17px;
  background:
    radial-gradient(circle at 14% 8%,rgba(255,255,255,.72),transparent 30%),
    radial-gradient(circle at 86% 92%,rgba(255,255,255,.42),transparent 34%),
    linear-gradient(135deg,#e9e9e7,#dededb 52%,#e8e8e5);
}
.shell{
  height:100%;display:grid;grid-template-columns:300px 410px minmax(0,1fr);
  grid-template-rows:76px minmax(0,1fr);
  gap:14px;padding:14px;border-radius:28px;
  background:rgba(232,232,229,.78);
  border:1px solid rgba(255,255,255,.82);
  box-shadow:14px 14px 35px var(--shadow-lo),-14px -14px 35px var(--shadow-hi),inset 1px 1px 0 rgba(255,255,255,.7);
  position:relative;overflow:hidden;
}
.shell:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.34;
  background-image:radial-gradient(rgba(50,50,49,.11) .65px,transparent .75px);
  background-size:13px 13px;
  mask-image:linear-gradient(120deg,transparent 0%,rgba(0,0,0,.45) 35%,transparent 72%);
}
.top{
  grid-column:1/-1;display:flex;align-items:center;gap:18px;position:relative;z-index:1;
}
.brand{display:flex;align-items:center;gap:11px;width:285px;padding-left:9px;font-size:20px;font-weight:650;letter-spacing:-.03em}
.logo{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#f7f7f5,#d9d9d6);
  box-shadow:5px 5px 10px #bdbdbb,-5px -5px 10px #fff;
}
.logo:before{content:"";width:11px;height:11px;border:3px solid #252626;border-radius:50%;box-shadow:inset 1px 1px 2px #777}
.search{
  width:min(460px,42vw);height:46px;border:1px solid rgba(255,255,255,.82);border-radius:25px;
  background:linear-gradient(145deg,#e1e1de,#eeeeec);
  box-shadow:inset 2px 2px 5px rgba(100,100,99,.10),5px 5px 12px rgba(70,70,70,.13),-5px -5px 12px rgba(255,255,255,.72);
  padding:0 18px;font-size:13px;color:#333;
}
.search::placeholder{color:#9a9b99}
.top-spacer{flex:1}
.pill-group,.icon-btn,.raised{
  border:1px solid rgba(255,255,255,.86);
  background:linear-gradient(145deg,#efefed,#dfdfdc);
  box-shadow:4px 4px 10px rgba(78,79,78,.14),-4px -4px 10px rgba(255,255,255,.74),inset 1px 1px 1px rgba(255,255,255,.55);
}
.pill-group{padding:3px;border-radius:25px;display:flex}
.pill-group button{height:38px;padding:0 17px;border-radius:21px;font-size:12px;color:#666}
.pill-group button.active{background:linear-gradient(145deg,#f6f6f4,#dededb);box-shadow:3px 3px 8px rgba(70,70,70,.14),-3px -3px 8px #fff;color:#222}
.icon-btn{width:43px;height:43px;border-radius:50%;display:grid;place-items:center}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.panel{
  min-width:0;min-height:0;border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(242,242,240,.9),rgba(222,222,219,.92));
  border:1px solid rgba(255,255,255,.88);
  box-shadow:9px 9px 22px rgba(72,73,72,.15),-9px -9px 22px rgba(255,255,255,.76),inset 1px 1px 0 rgba(255,255,255,.7);
  position:relative;z-index:1;overflow:hidden;
}
.sidebar{display:flex;flex-direction:column;padding:18px 15px}
.new-actions{display:flex;gap:10px}
.new-note{
  flex:1;height:47px;border-radius:24px;font-size:13px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
}
.new-folder{
  flex:1;height:47px;border-radius:24px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:9px;
}
.new-note span:first-child{display:flex;align-items:center;gap:10px}
.kbd{font-size:10px;color:#777;border-radius:6px;padding:3px 6px;background:#e4e4e1;box-shadow:inset 1px 1px 2px #c8c8c5}
.section-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#8a8b89;margin:25px 7px 9px}
.tree{overflow:auto;flex:1;padding-right:2px}
.tree-row{
  min-height:37px;display:flex;align-items:center;gap:8px;border-radius:12px;padding:0 10px;color:#626462;font-size:13px;margin:2px 0;
}
.tree-row:hover{background:rgba(255,255,255,.38)}
.tree-row.active{color:#202122;background:linear-gradient(145deg,#f2f2f0,#dededb);box-shadow:4px 4px 9px rgba(70,70,70,.11),-4px -4px 9px #fff}
.twisty{width:12px;color:#929390;text-align:center}
.folder-icon{width:16px;height:16px;border:1.4px solid #777;border-radius:3px;position:relative}
.folder-icon:before{content:"";position:absolute;width:6px;height:3px;left:1px;top:-4px;border:1.4px solid #777;border-bottom:0;border-radius:2px 2px 0 0}
.count{margin-left:auto;font-size:10px;color:#a0a19e}
.storage{
  padding:14px;margin-top:12px;border-radius:17px;
  background:linear-gradient(145deg,#ededeb,#ddddda);
  box-shadow:inset 2px 2px 5px rgba(80,80,80,.08),inset -2px -2px 5px rgba(255,255,255,.7);
}
.storage-top{display:flex;justify-content:space-between;font-size:12px}.storage-top span:last-child{color:#929390}
.storage-sub{font-size:10px;color:#8a8b89;margin-top:6px}
.bar{height:5px;border-radius:4px;background:#d2d2cf;box-shadow:inset 1px 1px 2px #bdbdb9;margin-top:10px;overflow:hidden}.bar i{display:block;width:18%;height:100%;background:#898a88;border-radius:4px}
.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;height:42px;border-radius:20px;font-size:11px}
.list{display:flex;flex-direction:column;padding:18px 0}
.list-head{padding:0 19px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start}
.list-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em}.list-head small{display:block;color:#8b8c89;font-size:11px;margin-top:4px}
.list-menu{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.notes{overflow:auto;padding:10px 11px}
.note-card{padding:14px 12px;border-radius:17px;margin:3px 0;cursor:pointer;transition:.18s ease}
.note-card:hover{background:rgba(255,255,255,.36)}
.note-card.active{
  background:linear-gradient(145deg,#f2f2f0,#dededb);
  box-shadow:5px 5px 11px rgba(71,72,71,.13),-5px -5px 11px rgba(255,255,255,.76);
}
.note-title{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:550}.note-date{margin-left:auto;color:#8f908d;font-size:10px;font-weight:400}
.note-preview{font-size:11px;color:#767875;line-height:1.45;margin-top:7px;max-width:95%}
.note-divider{height:1px;background:var(--line);margin:0 10px}
.editor-panel{display:flex;flex-direction:column;padding:0}
.editor-toolbar{height:58px;display:flex;align-items:center;gap:8px;padding:0 17px;border-bottom:1px solid var(--line)}
.toolbar-spacer{flex:1}.saved{font-size:11px;color:#8b8c89;display:flex;align-items:center;gap:6px}.saved-dot{width:7px;height:7px;border-radius:50%;background:#8d8e8b;box-shadow:0 0 0 3px rgba(141,142,139,.10)}
.tool{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#777}
.tool:hover{background:rgba(255,255,255,.45)}
.editor{
  flex:1;overflow:auto;padding:48px clamp(30px,5vw,70px) 38px;
  background:
    radial-gradient(circle at 92% 18%,rgba(255,255,255,.38),transparent 27%),
    linear-gradient(145deg,rgba(246,246,244,.34),rgba(220,220,217,.20));
  position:relative;
}
.editor:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.26;
  background-image:radial-gradient(#7f807d .55px,transparent .7px);background-size:13px 13px;
  mask-image:radial-gradient(ellipse at 90% 18%,#000 0%,transparent 68%);
}
.note-wrap{max-width:760px;margin:auto;position:relative;z-index:1}
.title{width:100%;border:0;background:transparent;outline:0;font-size:32px;font-weight:620;letter-spacing:-.04em;color:#222;padding:0;margin:0 0 11px}
.title::placeholder{color:#a2a3a0}.date{font-size:11px;color:#8d8e8b;margin-bottom:42px}
.content{width:100%;min-height:54vh;resize:none;border:0;outline:0;background:transparent;font-size:15px;line-height:1.9;color:#303130}
.content::placeholder{color:#9a9b98}.meta{font-size:10px;color:#999a97;margin-top:28px;text-align:right}
.ai{
  margin:0 15px 15px;padding:13px 15px;border-radius:19px;display:flex;align-items:center;gap:13px;
  background:linear-gradient(145deg,#ededeb,#dededb);border:1px solid rgba(255,255,255,.82);
  box-shadow:6px 6px 14px rgba(70,71,70,.13),-6px -6px 14px rgba(255,255,255,.72),inset 1px 1px 0 rgba(255,255,255,.6);
}
.ai-mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f5f5f3,#d9d9d6);box-shadow:3px 3px 7px #c1c1be,-3px -3px 7px #fff}
.ai-copy{min-width:0}.ai-title{font-size:12px;font-weight:600}.ai-copy p{margin:4px 0 0;color:#858682;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai select{margin-left:auto;height:34px;border:1px solid rgba(255,255,255,.8);border-radius:17px;background:#e5e5e2;padding:0 10px;font-size:10px;box-shadow:inset 1px 1px 2px #cfcfcb}
.ai button{height:37px;padding:0 15px;border-radius:20px;font-size:11px}
.toast{position:fixed;right:28px;bottom:28px;padding:10px 14px;border-radius:16px;background:#ececea;color:#222;font-size:11px;box-shadow:7px 7px 18px #aaa,-7px -7px 18px #fff;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:30}.toast.show{opacity:1;transform:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(100,101,99,.22);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50}.modal-backdrop.open{display:flex}
.modal{width:min(500px,calc(100vw - 30px));padding:24px;border-radius:24px;background:linear-gradient(145deg,#f0f0ee,#dededb);border:1px solid #fff;box-shadow:15px 15px 40px #9f9f9c,-15px -15px 40px #fff}.modal h2{margin:0 0 6px;font-size:18px}.modal p{margin:0 0 18px;font-size:11px;line-height:1.6;color:#7e7f7c}.field{margin:10px 0}.field label{display:block;font-size:10px;color:#777873;margin-bottom:6px}.field input{width:100%;height:40px;border:0;border-radius:12px;background:#e3e3e0;box-shadow:inset 2px 2px 5px #c9c9c6,inset -2px -2px 5px #f6f6f4;padding:0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-actions button{height:38px;padding:0 15px;border-radius:19px}.primary{background:linear-gradient(145deg,#f5f5f3,#d9d9d6);box-shadow:4px 4px 9px #c1c1be,-4px -4px 9px #fff}

.folder-color{width:9px;height:9px;border-radius:50%;flex:none;background:var(--folder-color,#777976);box-shadow:0 0 0 2px rgba(255,255,255,.55),1px 1px 3px rgba(70,70,70,.18)}
.db-size{font-size:10px;color:#8a8b88;margin-top:3px}
.mobile-nav{display:none}
 .field select{width:100%;height:40px;border:0;border-radius:12px;background:#e3e3e0;box-shadow:inset 2px 2px 5px #c9c9c6,inset -2px -2px 5px #f6f6f4;padding:0 12px}
 .endpoint-list{display:flex;flex-direction:column;gap:7px;margin-bottom:9px;max-height:150px;overflow:auto}
 .endpoint-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;background:#e3e3e0;box-shadow:inset 1px 1px 3px #c9c9c6,inset -1px -1px 3px #f6f6f4;font-size:11px}
 .endpoint-item .ep-name{font-weight:600;flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .endpoint-item .ep-url{color:#8a8b88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
 .endpoint-item .ep-del{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#a0a19e;font-size:15px;flex:none}
 .endpoint-item .ep-del:hover{color:#d05a5a}
 .endpoint-add{display:grid;gap:7px}
 .endpoint-add .row{display:flex;gap:7px}
 .endpoint-add input{width:100%}
 .endpoint-add .primary{height:40px;flex:none;padding:0 16px}
 .endpoint-empty{font-size:10px;color:#9a9b98;margin-bottom:9px}
 @media(max-width:700px){
  .app{padding:6px}
  .shell{display:block;position:relative;padding:7px;border-radius:24px;overflow:hidden}
  .top{height:58px;display:flex;gap:8px;padding:0 4px}
  .brand{width:auto;padding-left:4px}
  .brand span:not(.logo){display:none}
  .search{flex:1;width:auto;min-width:0;height:42px;padding:0 14px}
  .top-spacer,.pill-group{display:none}
  .top .icon-btn{width:39px;height:39px;flex:none}
  .panel{position:absolute;left:7px;right:7px;top:72px;bottom:62px;border-radius:20px;display:none}
  .sidebar{display:flex;padding:14px 11px}
  .list{display:none}
  .editor-panel{display:none}
  .shell[data-mobile-view="folders"] .sidebar{display:flex}
  .shell[data-mobile-view="notes"] .list{display:flex}
  .shell[data-mobile-view="editor"] .editor-panel{display:flex}
  .sidebar .section-label{display:block}
  .sidebar .tree .tree-row{min-height:44px;font-size:13px}
  .storage{display:block}
  .actions{display:flex}
  .actions button{height:44px}
  .list-head{padding:14px 16px}
  .notes{padding:9px}
  .note-card{padding:15px 12px;min-height:74px}
  .editor-toolbar{height:52px;padding:0 10px}
  .editor{padding:34px 20px 28px}
  .title{font-size:28px}
  .date{margin-bottom:30px}
  .content{font-size:16px;line-height:1.82;min-height:45vh}
  .ai{margin:0 9px 9px;padding:10px;gap:8px}
  .ai-copy{display:block;min-width:0}
  .ai-copy p{display:none}
  .ai select{max-width:125px}
  .ai button{padding:0 12px}
  .mobile-nav{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);left:10px;right:10px;bottom:10px;height:49px;z-index:5;padding:3px;border-radius:25px;background:linear-gradient(145deg,#efefed,#ddddda);border:1px solid rgba(255,255,255,.9);box-shadow:6px 6px 14px rgba(70,70,70,.15),-6px -6px 14px rgba(255,255,255,.78)}
  .mobile-nav button{border-radius:21px;font-size:11px;color:#777}
  .mobile-nav button.active{background:linear-gradient(145deg,#f5f5f3,#ddddda);color:#222;box-shadow:3px 3px 7px rgba(70,70,70,.13),-3px -3px 7px #fff}
  .modal{max-height:calc(100vh - 30px);overflow:auto}
}
@media(max-width:1100px){.shell{grid-template-columns:245px 340px minmax(0,1fr)}.brand{width:230px}}
@media(max-width:850px){.app{padding:8px}.shell{grid-template-columns:70px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);padding:8px;gap:8px}.brand{width:auto}.brand span:not(.logo){display:none}.search{width:35vw}.sidebar{padding:14px 8px}.sidebar .section-label,.sidebar .tree .tree-row span:not(.twisty):not(.folder-icon),.storage,.actions{display:none}.new-actions{flex-direction:column;gap:8px}.new-note{width:auto;padding:0;justify-content:center}.new-note span:last-child{display:none}.new-folder{width:46px;padding:0;font-size:16px}.new-folder span{display:none}.list{display:none}.editor{padding:35px 25px}.ai-copy{display:none}}
</style>
</head>
<body>
<div class="app">
<div class="shell">
<header class="top">
  <div class="brand"><div class="logo"></div><span>Plainnote</span></div>
  <input id="search" class="search" placeholder="Search notes…     ⌘ K" autocomplete="off">
  <div class="top-spacer"></div>
  <div class="pill-group"><button id="localMode" class="active">Local</button><button id="driveMode">Google Drive</button></div>
  <button class="icon-btn" id="settings" title="Settings"><svg><circle cx="12" cy="12" r="3"/><path d="M19 15.2a2 2 0 0 0 .4 2.2l.1.1-2 2-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8V21h-3v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2-2 .1-.1a2 2 0 0 0 .4-2.2A2 2 0 0 0 6.2 14H6v-3h.2a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.1-.1 2-2 .1.1a2 2 0 0 0 2.2.4A2 2 0 0 0 13 4.2V4h3v.2a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1 2 2-.1.1a2 2 0 0 0-.4 2.2A2 2 0 0 0 22 11h.2v3H22a2 2 0 0 0-1.8 1.2z"/></svg></button>
  <button class="icon-btn" id="theme" title="Appearance"><svg><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<aside class="panel sidebar">
  <div class="new-actions">
    <button class="raised new-note" id="newNote"><span><b style="font-size:18px;font-weight:400">＋</b> New Note</span><span class="kbd">⌘N</span></button>
    <button class="raised new-folder" id="newFolderBtn"><b style="font-size:18px;font-weight:400">🗀</b> Folder</button>
  </div>
  <div class="section-label">Folders</div>
  <div class="tree" id="tree"></div>
  <div class="storage">
    <div class="storage-top"><span>Storage</span><span id="storageType">Local</span></div>
    <div class="storage-sub" id="storageSub">IndexedDB · browser only</div>
    <div class="db-size" id="dbSize">Calculating…</div>
    <div class="bar"><i></i></div>
  </div>
  <div class="actions"><button class="raised" id="export">⇩ Export</button><button class="raised" id="import">⇧ Import</button></div>
</aside>

<section class="panel list">
  <div class="list-head"><div><h2 id="folderTitle">Personal</h2><small id="folderCount">0 notes</small></div><button class="list-menu" id="newFolder">•••</button></div>
  <div class="notes" id="notes"></div>
</section>

<section class="panel editor-panel">
  <div class="editor-toolbar">
    <button class="tool" id="back">‹</button><button class="tool" id="forward">›</button><button class="tool" id="star">☆</button>
    <div class="toolbar-spacer"></div>
    <button class="tool" id="delete">♢</button><div class="saved"><span class="saved-dot"></span><span id="saveState">Saved</span></div>
  </div>
  <div class="editor">
    <div class="note-wrap">
      <input id="title" class="title" placeholder="Untitled note" autocomplete="off">
      <div class="date" id="date"></div>
      <textarea id="content" class="content" placeholder="Start writing…"></textarea>
      <div class="meta" id="meta">0 characters</div>
    </div>
  </div>
  <div class="ai">
    <div class="ai-mark">✦</div>
    <div class="ai-copy"><div class="ai-title">AI Assistant <small style="color:#9a9b98;font-size:8px"> BETA</small></div><p>Review, summarize, or ask anything about this note.</p></div>
    <select id="model"><option>openai/gpt-4o-mini</option><option>google/gemini-2.5-flash</option><option>anthropic/claude-3.5-haiku</option></select>
    <button class="raised" id="askAI">✦ Ask AI</button>
  </div>
</section>
<nav class="mobile-nav" id="mobileNav">
  <button data-view="folders" class="active">Folders</button>
  <button data-view="notes">Notes</button>
  <button data-view="editor">Editor</button>
</nav>
</div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<input id="importFile" type="file" accept=".plainnote,.json" hidden>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(()=>{"use strict";
const DB="plainnote-v2",VER=1,$=id=>document.getElementById(id),uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString();
 let db,state={items:[],selected:null,folder:null,mode:"local",driveToken:null},timer,endpoints=[];
const toast=m=>{let t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t.x);t.x=setTimeout(()=>t.classList.remove("show"),1800)};
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore("items",{keyPath:"id"});d.createObjectStore("settings",{keyPath:"key"})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function store(n,m="readonly"){return db.transaction(n,m).objectStore(n)}
function all(){return new Promise((ok,no)=>{let r=store("items").getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(x){return new Promise((ok,no)=>{let r=store("items","readwrite").put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function del(id){return new Promise((ok,no)=>{let r=store("items","readwrite").delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function setting(k){return new Promise(ok=>{let r=store("settings").get(k);r.onsuccess=()=>ok(r.result?.value)})}
function saveSetting(k,v){return new Promise(ok=>{let r=store("settings","readwrite").put({key:k,value:v});r.onsuccess=ok})}async function updateDbSize(){
  const el=$("dbSize");if(!el)return;
  try{
    const e=await navigator.storage.estimate();
    const n=e.usage||0,q=e.quota||0;
    const fmt=v=>v<1024?`${v} B`:v<1048576?`${(v/1024).toFixed(1)} KB`:v<1073741824?`${(v/1048576).toFixed(1)} MB`:`${(v/1073741824).toFixed(2)} GB`;
    el.textContent=`${fmt(n)} used${q?` · ${fmt(q)} quota`:""}`;
  }catch{el.textContent="Size unavailable"}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function kids(id){return state.items.filter(x=>x.parentId===id)}
function root(){return state.items.find(x=>x.type==="folder"&&!x.parentId)}
function path(id){let a=[],x=state.items.find(y=>y.id===id);while(x){a.unshift(x.name);x=x.parentId?state.items.find(y=>y.id===x.parentId):null}return a.join(" / ")}
function renderTree(){
 const t=$("tree");
 t.innerHTML="";
 function draw(parentId,depth){
  const folders=kids(parentId).filter(x=>x.type==="folder").sort((a,b)=>a.name.localeCompare(b.name));
  folders.forEach(f=>{
   const row=document.createElement("div");
   row.className="tree-row "+(state.folder===f.id?"active":"");
   row.style.paddingLeft=(10+depth*15)+"px";
   const twist=document.createElement("span");twist.className="twisty";
   const hasKids=kids(f.id).length>0;const open=state.folder===f.id||!f.parentId;twist.textContent=hasKids?(open?"⌄":"›"):"";
   const color=document.createElement("span");color.className="folder-color";color.style.setProperty("--folder-color",f.color||"#777976");
   const icon=document.createElement("span");icon.className="folder-icon";
   const name=document.createElement("span");name.textContent=f.name;
   const count=document.createElement("span");count.className="count";count.textContent=kids(f.id).filter(x=>x.type==="note").length;
   row.append(twist,color,icon,name,count);row.onclick=()=>{state.folder=f.id;renderAll();if(innerWidth<=700)setMobileView("notes")};row.ondblclick=()=>rename(f);t.appendChild(row);
   if(open)draw(f.id,depth+1);
  });
 }
 draw(null,0);
}
function renderNotes(){
 const list=$("notes"),folderId=state.folder||root()?.id;
 const notes=kids(folderId).filter(x=>x.type==="note").sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
 list.innerHTML="";
 const folder=state.items.find(x=>x.id===folderId);
 $("folderTitle").textContent=folder?.name||"Personal";
 $("folderCount").textContent=notes.length+" note"+(notes.length===1?"":"s");
 notes.forEach((x,i)=>{
  const card=document.createElement("div");card.className="note-card "+(x.id===state.selected?"active":"");
  const head=document.createElement("div");head.className="note-title";
  const title=document.createElement("span");title.textContent=x.title||"Untitled note";
  const date=document.createElement("span");date.className="note-date";date.textContent=new Date(x.updatedAt).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  head.append(title,date);
  const preview=document.createElement("div");preview.className="note-preview";preview.textContent=(x.content||"").replace(/\s+/g," ").slice(0,110);
  card.append(head,preview);card.onclick=()=>select(x.id);card.ondblclick=()=>rename(x);list.appendChild(card);
  if(i<notes.length-1){const d=document.createElement("div");d.className="note-divider";list.appendChild(d)}
 });
}
function renderAll(){renderTree();renderNotes()}
function setMobileView(view){document.querySelector(".shell").dataset.mobileView=view;document.querySelectorAll("#mobileNav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view))}
function select(id){state.selected=id;let n=state.items.find(x=>x.id===id);if(!n)return;state.folder=n.parentId;$("title").value=n.title;$("content").value=n.content;$("date").textContent=new Date(n.updatedAt).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})+"  ·  "+new Date(n.updatedAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});updateMeta();renderAll();if(innerWidth<=700)setMobileView("editor")}
function updateMeta(){$("meta").textContent=$("content").value.length.toLocaleString()+" characters"}
async function createNote(){let p=state.folder||root()?.id,n={id:uid(),type:"note",parentId:p,title:"",content:"",createdAt:now(),updatedAt:now()};state.items.push(n);await put(n);await updateDbSize();select(n.id);$("title").focus()}
async function createFolder(){
  modal(`<h2>New Folder</h2><p>Choose a name and a restrained accent color. Folder colors are stored in the note database and included in exports.</p>
  <div class="field"><label>Name</label><input id="folderName" placeholder="Folder name"></div>
  <div class="field"><label>Color</label><select id="folderColor">
  <option value="#777976">Graphite</option><option value="#85877f">Olive Gray</option><option value="#8a8179">Warm Stone</option><option value="#7f8787">Slate</option><option value="#8d7f86">Mauve Gray</option><option value="#777f8a">Blue Gray</option><option value="#8b8171">Sand</option><option value="#696b69">Charcoal</option>
  </select></div>
  <div class="modal-actions"><button id="cancel">Cancel</button><button class="primary" id="create">Create Folder</button></div>`);
  $("cancel").onclick=closeModal;
  $("create").onclick=async()=>{let name=$("folderName").value.trim();if(!name)return toast("Folder name required");let f={id:uid(),type:"folder",parentId:state.folder||root()?.id,name,color:$("folderColor").value,createdAt:now(),updatedAt:now()};state.items.push(f);state.folder=f.id;await put(f);await updateDbSize();closeModal();renderAll();toast("Folder created")};
  $("folderName").focus();
}
async function rename(x){
  if(x.type!=="folder"){let n=prompt("Rename",x.title);if(!n?.trim())return;x.title=n.trim();x.updatedAt=now();await put(x);await updateDbSize();if(x.id===state.selected)select(x.id);renderAll();return}
  const colors=[["#777976","Graphite"],["#85877f","Olive Gray"],["#8a8179","Warm Stone"],["#7f8787","Slate"],["#8d7f86","Mauve Gray"],["#777f8a","Blue Gray"],["#8b8171","Sand"],["#696b69","Charcoal"]];
  modal(`<h2>Edit Folder</h2><p>Rename the folder or change its subtle accent.</p><div class="field"><label>Name</label><input id="folderName" value="${esc(x.name)}"></div><div class="field"><label>Color</label><select id="folderColor">${colors.map(([c,n])=>`<option value="${c}" ${x.color===c?"selected":""}>${n}</option>`).join("")}</select></div><div class="modal-actions"><button id="cancel">Cancel</button><button class="primary" id="saveFolder">Save</button></div>`);
  $("cancel").onclick=closeModal;
  $("saveFolder").onclick=async()=>{let n=$("folderName").value.trim();if(!n)return toast("Folder name required");x.name=n;x.color=$("folderColor").value;x.updatedAt=now();await put(x);await updateDbSize();closeModal();renderAll();toast("Folder updated")};
}
function schedule(){clearTimeout(timer);$("saveState").textContent="Unsaved";timer=setTimeout(saveCurrent,300)}
async function saveCurrent(){let n=state.items.find(x=>x.id===state.selected);if(!n)return;n.title=$("title").value;n.content=$("content").value;n.updatedAt=now();await put(n);updateDbSize();$("saveState").textContent="Saved";$("date").textContent=new Date(n.updatedAt).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})+"  ·  "+new Date(n.updatedAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});updateMeta();renderNotes();if(state.mode==="drive"&&state.driveToken)driveSync(n).catch(console.warn)}
function setMode(m){state.mode=m;$("localMode").classList.toggle("active",m==="local");$("driveMode").classList.toggle("active",m==="drive");$("storageType").textContent=m==="local"?"Local":state.driveToken?"Google Drive":"Drive";$("storageSub").textContent=m==="local"?"IndexedDB · browser only":"Google Drive · OAuth";saveSetting("mode",m);if(m==="drive"&&!state.driveToken)driveSetup()}
function modal(html){$("modal").innerHTML=html;$("modalBackdrop").classList.add("open")}
function closeModal(){$("modalBackdrop").classList.remove("open")}
function driveSetup(){modal(`<h2>Connect Google Drive</h2><p>Plainnote has no backend. Drive access happens directly in your browser using Google's OAuth flow. Supply your own Web OAuth Client ID.</p><div class="field"><label>OAuth Client ID</label><input id="clientId" placeholder="…apps.googleusercontent.com"></div><div class="modal-actions"><button id="cancel">Cancel</button><button class="primary" id="connect">Connect</button></div>`);$("cancel").onclick=()=>{closeModal();setMode("local")};$("connect").onclick=()=>connectDrive($("clientId").value.trim())}
function connectDrive(id){if(!id)return toast("Client ID required");try{let tc=google.accounts.oauth2.initTokenClient({client_id:id,scope:"https://www.googleapis.com/auth/drive.file",callback:r=>{if(r.error)return toast("Drive authorization failed");state.driveToken=r.access_token;closeModal();setMode("drive");toast("Google Drive connected");loadDrive()}});tc.requestAccessToken({prompt:"consent"})}catch(e){toast("Google Identity Services is not ready")}}
async function df(url,o={}){let r=await fetch(url,{...o,headers:{Authorization:"Bearer "+state.driveToken,...(o.headers||{})}});if(!r.ok)throw Error(await r.text());return r}
async function loadDrive(){
 try{
  const query=encodeURIComponent("trashed=false");
  const url="https://www.googleapis.com/drive/v3/files?pageSize=1000&q="+query+"&fields=files(id,name,mimeType,modifiedTime,appProperties)";
  const response=await df(url);
  const data=await response.json();
  const files=data.files||[];
  for(const file of files){
   if(file.mimeType!=="text/plain")continue;
   if(!file.appProperties||file.appProperties.plainnote!=="1")continue;
   const existing=state.items.find(x=>x.driveId===file.id);
   if(existing)continue;
   const bodyResponse=await df("https://www.googleapis.com/drive/v3/files/"+file.id+"?alt=media");
   const body=await bodyResponse.text();
   const note={id:uid(),type:"note",parentId:root().id,title:file.name.replace(/\.txt$/,""),content:body,createdAt:file.modifiedTime,updatedAt:file.modifiedTime,driveId:file.id};
   state.items.push(note);await put(note);
  }
  renderAll();toast("Drive notes loaded");
 }catch(e){console.warn(e);toast("Drive sync failed")}
}
async function driveSync(n){let meta={name:(n.title||"Untitled note")+".txt",mimeType:"text/plain",appProperties:{plainnote:"1"}};let form=new FormData();form.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));form.append("file",new Blob([n.content],{type:"text/plain"}));if(n.driveId){await df("https://www.googleapis.com/upload/drive/v3/files/"+n.driveId+"?uploadType=multipart",{method:"PATCH",body:form})}else{let r=await df("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{method:"POST",body:form});n.driveId=(await r.json()).id;await put(n)}}
function exportData(){let blob=new Blob([JSON.stringify({format:"plainnote",version:1,exportedAt:now(),items:state.items},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="plainnote-export-"+now().slice(0,10)+".plainnote";a.click();URL.revokeObjectURL(a.href);toast("Export complete")}
async function importData(file){try{let d=JSON.parse(await file.text());if(d.format!=="plainnote")throw Error("Invalid Plainnote file");let ids=new Set(state.items.map(x=>x.id));for(let x of d.items){if(ids.has(x.id))x.id=uid();state.items.push(x);await put(x)}renderAll();toast("Import complete")}catch(e){toast("Import failed")}}
function search(q){q=q.trim().toLowerCase();let notes=q?state.items.filter(x=>x.type==="note"&&((x.title+" "+x.content).toLowerCase().includes(q))):[];let list=$("notes");if(!q)return renderNotes();list.innerHTML="";$("folderTitle").textContent="Search";$("folderCount").textContent=notes.length+" matches";notes.forEach(x=>{let r=document.createElement("div");r.className="note-card";r.innerHTML='<div class="note-title"><span>'+esc(x.title||"Untitled note")+'</span></div><div class="note-preview">'+esc(x.content.slice(0,130).replace(/\s+/g," "))+"</div>";r.onclick=()=>select(x.id);list.appendChild(r)})}
 function renderModelOptions(){
  const sel=$("model"),cur=sel.value,defaults=["openai/gpt-4o-mini","google/gemini-2.5-flash","anthropic/claude-3.5-haiku"];
  sel.innerHTML="";
  defaults.forEach(m=>{const o=document.createElement("option");o.value=m;o.textContent=m;sel.appendChild(o)});
  endpoints.forEach((e,i)=>{const o=document.createElement("option");o.value="custom:"+i;o.textContent=e.name;sel.appendChild(o)});
  if([...sel.options].some(o=>o.value===cur))sel.value=cur;
 }
 async function settings(){
  let key=await setting("orKey")||"";
  endpoints=await setting("endpoints")||[];
  modal(`<h2>Settings</h2><p>Local data stays in IndexedDB. Requests are sent directly from this browser (BYOK). Add custom model endpoints to use them from the AI assistant dropdown.</p>
  <div class="field"><label>OpenRouter API key</label><input id="orKey" type="password" value="${esc(key)}" placeholder="sk-or-v1-…"></div>
  <div class="field"><label>Custom Model Endpoints</label>
   <div class="endpoint-list" id="endpointList"></div>
   <div class="endpoint-add">
    <input id="epName" placeholder="Label (e.g. Local Llama)">
    <div class="row"><input id="epUrl" placeholder="https://host/v1/chat/completions"><input id="epModel" placeholder="model id (optional)"></div>
    <div class="row"><input id="epKey" type="password" placeholder="API key (optional)"><button class="primary" id="addEp">Add</button></div>
   </div>
  </div>
  <div class="modal-actions"><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>`);
  function drawList(){
   const list=$("endpointList");list.innerHTML="";
   if(!endpoints.length){const e=document.createElement("div");e.className="endpoint-empty";e.textContent="No custom endpoints yet.";list.appendChild(e);return}
   endpoints.forEach((e,i)=>{
    const item=document.createElement("div");item.className="endpoint-item";
    const name=document.createElement("span");name.className="ep-name";name.textContent=e.name;
    const url=document.createElement("span");url.className="ep-url";url.textContent=e.url;
    const del=document.createElement("button");del.className="ep-del";del.textContent="×";del.onclick=()=>{endpoints.splice(i,1);drawList()};
    item.append(name,url,del);list.appendChild(item);
   });
  }
  drawList();
  $("addEp").onclick=()=>{
   const name=$("epName").value.trim(),url=$("epUrl").value.trim();
   if(!name||!url)return toast("Label and URL required");
   endpoints.push({name,url,model:$("epModel").value.trim(),key:$("epKey").value.trim()});
   $("epName").value="";$("epUrl").value="";$("epModel").value="";$("epKey").value="";
   drawList();
  };
  $("cancel").onclick=closeModal;
  $("save").onclick=async()=>{
   await saveSetting("orKey",$("orKey").value.trim());
   await saveSetting("endpoints",endpoints);
   closeModal();renderModelOptions();toast("Settings saved");
  };
 }
 async function askAI(){
  let n=state.items.find(x=>x.id===state.selected),key=await setting("orKey");
  if(!n)return toast("Open a note first");
  const sel=$("model").value;
  let url="https://openrouter.ai/api/v1/chat/completions",model=sel,authKey=key;
  if(sel.startsWith("custom:")){
   const ep=endpoints[+sel.slice(7)];
   if(!ep)return toast("Selected endpoint missing");
   url=ep.url;model=ep.model||ep.name;authKey=ep.key||key;
   if(!authKey)return toast("API key required for this endpoint");
  }else if(!key)return settings();
  toast("Reviewing note…");
  try{
   let r=await fetch(url,{method:"POST",headers:{"Authorization":"Bearer "+authKey,"Content-Type":"application/json","HTTP-Referer":location.href,"X-Title":"Plainnote"},body:JSON.stringify({model,messages:[{role:"user",content:"Review this plain-text note for factual ambiguity, logical gaps, unsupported claims, and unclear terminology. Return concise findings only.\\n\\n"+n.content}],temperature:.2})});
   let d=await r.json();if(!r.ok)throw Error(d.error?.message||"Request failed");
   modal("<h2>AI Review</h2><p>"+esc(d.choices?.[0]?.message?.content||"No response").replace(/\\n/g,"<br>")+'</p><div class="modal-actions"><button class="primary" id="close">Close</button></div>');$("close").onclick=closeModal
  }catch(e){toast(e.message)}
 }
$("newNote").onclick=createNote;$("newFolderBtn").onclick=createFolder;document.querySelectorAll("#mobileNav button").forEach(b=>b.onclick=()=>setMobileView(b.dataset.view));$("newFolder").onclick=createFolder;$("export").onclick=exportData;$("import").onclick=()=>$("importFile").click();$("importFile").onchange=e=>e.target.files[0]&&importData(e.target.files[0]);$("localMode").onclick=()=>setMode("local");$("driveMode").onclick=()=>setMode("drive");$("settings").onclick=settings;$("askAI").onclick=askAI;$("title").oninput=schedule;$("content").oninput=()=>{updateMeta();schedule()};$("search").oninput=e=>search(e.target.value);$("delete").onclick=async()=>{let n=state.items.find(x=>x.id===state.selected);if(!n)return;if(confirm("Delete this note?")){await del(n.id);updateDbSize();state.items=state.items.filter(x=>x.id!==n.id);state.selected=null;let next=kids(state.folder).find(x=>x.type==="note");next?select(next.id):(state.folder=state.folder,renderAll(),$("title").value="",$("content").value="")}};$("star").onclick=()=>toast("Star saved for this note");$("theme").onclick=()=>toast("Monochrome appearance is fixed");$("back").onclick=()=>history.back();$("forward").onclick=()=>history.forward();$("modalBackdrop").onclick=e=>e.target===e.currentTarget&&closeModal();document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="n"){e.preventDefault();createNote()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("search").focus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveCurrent()}if(e.key==="Escape")closeModal()});
(async()=>{await openDB();state.items=await all();state.items.filter(x=>x.type==="folder"&&!x.color).forEach(x=>x.color="#777976");if(!state.items.some(x=>x.type==="folder"&&!x.parentId)){let f={id:uid(),type:"folder",parentId:null,name:"Personal",color:"#777976",createdAt:now(),updatedAt:now()};state.items.push(f);await put(f)} state.folder=root().id;setMobileView("folders");updateDbSize();endpoints=await setting("endpoints")||[];renderModelOptions();let n=state.items.find(x=>x.type==="note");n?select(n.id):await createNote();if(await setting("mode")==="drive")setMode("drive")})().catch(e=>{console.error(e);toast("Could not initialize")});
})();
