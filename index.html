<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8e8e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NoteZen">
<title>NoteZen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
<div class="shell">
<header class="top">
  <div class="brand"><div class="logo"></div><span>NoteZen</span></div>
  <input id="search" class="search" placeholder="Search notes…     ⌘ K" autocomplete="off">
  <div class="top-spacer"></div>
  <div class="pill-group"><button id="localMode" class="active">Local</button><button id="driveMode">Google Drive</button></div>
  <button class="icon-btn" id="settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 15.2a2 2 0 0 0 .4 2.2l.1.1-2 2-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8V21h-3v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2-2 .1-.1a2 2 0 0 0 .4-2.2A2 2 0 0 0 6.2 14H6v-3h.2a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.1-.1 2-2 .1.1a2 2 0 0 0 2.2.4A2 2 0 0 0 13 4.2V4h3v.2a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1 2 2-.1.1a2 2 0 0 0-.4 2.2A2 2 0 0 0 22 11h.2v3H22a2 2 0 0 0-1.8 1.2z"/></svg></button>
  <button class="icon-btn" id="theme" title="Appearance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<aside class="panel sidebar">
  <div class="section-label">Folders</div>
  <div class="tree" id="tree"></div>
  <div class="storage">
    <div class="storage-top"><span>Storage</span><span id="storageType">Local</span></div>
    <div class="storage-sub" id="storageSub">IndexedDB · browser only</div>
    <div class="db-size" id="dbSize">Calculating…</div>
    <div class="bar"><i></i></div>
  </div>
  <div class="actions"><button class="raised" id="export" title="Export"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button><button class="raised" id="import" title="Import"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button><button class="raised" id="trashBtn" title="Trash"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button></div>
</aside>

<section class="panel list">
  <div class="list-head"><div><h2 id="folderTitle">Personal</h2><small id="folderCount">0 notes</small></div><div class="list-actions"><button class="raised new-note" id="newNote"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></button><button class="raised new-folder" id="newFolderBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button></div></div>
  <div class="notes" id="notes"></div>
</section>

<section class="panel editor-panel">
  <div class="editor-toolbar">
    <button class="tool" id="back">‹</button><button class="tool" id="forward">›</button><button class="tool" id="star">☆</button>
    <div class="toolbar-spacer"></div>
    <button class="tool" id="delete" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button><div class="saved"><span class="saved-dot"></span><span id="saveState">Saved</span></div>
  </div>
  <div class="editor">
    <div class="note-wrap">
      <input id="title" class="title" placeholder="Untitled note" autocomplete="off">
      <div class="date" id="date"></div>
      <textarea id="content" class="content" placeholder="Start writing…"></textarea>
      <div class="meta" id="meta">0 characters</div>
    </div>
  </div>
  <div class="ai" id="aiPanel">
    <div class="ai-mark">✦</div>
    <div class="ai-copy"><div class="ai-title">AI Assistant <small style="color:#9a9b98;font-size:8px"> BETA</small></div><p>Review, summarize, or ask anything about this note.</p></div>
    <div class="ai-setup" id="aiSetup">
      <span class="ai-setup-label">Not set up</span>
      <button class="raised" id="aiSetupBtn">Set up</button>
    </div>
    <select id="model" hidden><option>openai/gpt-4o-mini</option><option>google/gemini-2.5-flash</option><option>anthropic/claude-3.5-haiku</option></select>
    <button class="raised" id="askAI" hidden>✦ Ask AI</button>
  </div>
</section>
<nav class="mobile-nav" id="mobileNav">
  <button data-view="folders" class="active">Folders</button>
  <button data-view="notes">Notes</button>
  <button data-view="editor">Editor</button>
</nav>
</div>
</div>

<div class="ctx-backdrop" id="ctxBackdrop"></div>
<div class="context-menu" id="contextMenu"></div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<input id="importFile" type="file" accept=".plainnote,.json" hidden>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
