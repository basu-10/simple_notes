<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8e8e6">
<title>NoteZen</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
<div class="shell">
<header class="top">
  <div class="brand"><div class="logo"></div><span>NoteZen</span></div>
  <input id="search" class="search" placeholder="Search notes…     ⌘ K" autocomplete="off">
  <div class="top-spacer"></div>
  <div class="pill-group"><button id="localMode" class="active">Local</button><button id="driveMode">Google Drive</button></div>
  <button class="icon-btn" id="settings" title="Settings"><svg><circle cx="12" cy="12" r="3"/><path d="M19 15.2a2 2 0 0 0 .4 2.2l.1.1-2 2-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8V21h-3v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2-2 .1-.1a2 2 0 0 0 .4-2.2A2 2 0 0 0 6.2 14H6v-3h.2a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.1-.1 2-2 .1.1a2 2 0 0 0 2.2.4A2 2 0 0 0 13 4.2V4h3v.2a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1 2 2-.1.1a2 2 0 0 0-.4 2.2A2 2 0 0 0 22 11h.2v3H22a2 2 0 0 0-1.8 1.2z"/></svg></button>
  <button class="icon-btn" id="theme" title="Appearance"><svg><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<aside class="panel sidebar">
  <div class="section-label">Folders</div>
  <div class="tree" id="tree"></div>
  <div class="storage">
    <div class="storage-top"><span>Storage</span><span id="storageType">Local</span></div>
    <div class="storage-sub" id="storageSub">IndexedDB · browser only</div>
    <div class="db-size" id="dbSize">Calculating…</div>
    <div class="bar"><i></i></div>
  </div>
  <div class="actions"><button class="raised" id="export">⇩ Export</button><button class="raised" id="import">⇧ Import</button></div>
</aside>

<section class="panel list">
  <div class="list-head"><div><h2 id="folderTitle">Personal</h2><small id="folderCount">0 notes</small></div><div class="list-actions"><button class="raised new-note" id="newNote"><span><b style="font-size:18px;font-weight:400">＋</b> New Note</span><span class="kbd">⌘N</span></button><button class="raised new-folder" id="newFolderBtn"><b style="font-size:18px;font-weight:400">🗀</b> Folder</button></div></div>
  <div class="notes" id="notes"></div>
</section>

<section class="panel editor-panel">
  <div class="editor-toolbar">
    <button class="tool" id="back">‹</button><button class="tool" id="forward">›</button><button class="tool" id="star">☆</button>
    <div class="toolbar-spacer"></div>
    <button class="tool" id="delete">♢</button><div class="saved"><span class="saved-dot"></span><span id="saveState">Saved</span></div>
  </div>
  <div class="editor">
    <div class="note-wrap">
      <input id="title" class="title" placeholder="Untitled note" autocomplete="off">
      <div class="date" id="date"></div>
      <textarea id="content" class="content" placeholder="Start writing…"></textarea>
      <div class="meta" id="meta">0 characters</div>
    </div>
  </div>
  <div class="ai">
    <div class="ai-mark">✦</div>
    <div class="ai-copy"><div class="ai-title">AI Assistant <small style="color:#9a9b98;font-size:8px"> BETA</small></div><p>Review, summarize, or ask anything about this note.</p></div>
    <select id="model"><option>openai/gpt-4o-mini</option><option>google/gemini-2.5-flash</option><option>anthropic/claude-3.5-haiku</option></select>
    <button class="raised" id="askAI">✦ Ask AI</button>
  </div>
</section>
<nav class="mobile-nav" id="mobileNav">
  <button data-view="folders" class="active">Folders</button>
  <button data-view="notes">Notes</button>
  <button data-view="editor">Editor</button>
</nav>
</div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<input id="importFile" type="file" accept=".plainnote,.json" hidden>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
