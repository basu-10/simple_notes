<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8e8e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NoteZen">
<title>NoteZen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/styles.css">
<script src="./js/vendor/ckeditor/ckeditor.js"></script>
</head>
<body>
<div class="app">
<div class="shell">

<aside class="panel explorer">
  <div class="side-head">
    <a class="brand" href="index.html" title="NoteZen — home" aria-label="NoteZen home"><div class="logo"></div><span>NoteZen</span></a>
    <div class="side-tools">
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button class="icon-btn" id="theme" title="Appearance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4 1.4"/></svg></button>
    </div>
  </div>
  <input id="search" class="search" placeholder="Search notes…     ⌘ K" autocomplete="off">

  <div class="explorer-head">
    <div class="explorer-titles"><h2 id="folderTitle">Personal</h2><small id="folderCount">0 notes</small></div>
    <div class="explorer-actions">
      <button class="icon-btn new-folder-btn" id="newFolderBtn" title="New folder" aria-label="New folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></button>
      <button class="raised new-note" id="newNote"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></button>
    </div>
  </div>
  <div class="explorer-body" id="explorer"></div>
</aside>

<div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>

<section class="panel editor-panel">
  <div class="editor-toolbar">
    <button class="tool" id="back" title="Previous note">‹</button><button class="tool" id="forward" title="Next note">›</button><button class="tool" id="star">☆</button>
    <button class="tool" id="maximize" title="Focus mode (collapse panels)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <div class="toolbar-spacer"></div>
    <button class="tool" id="delete" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button><div class="saved"><span class="saved-dot"></span><span id="saveState">Saved</span></div>
  </div>
  <div class="editor">
    <div class="note-wrap">
      <input id="title" class="title" placeholder="Untitled note" autocomplete="off">
      <div class="date" id="date"></div>
      <textarea id="content" class="content" placeholder="Start writing…"></textarea>
      <div class="meta" id="meta">0 characters</div>
    </div>
  </div>
</section>
<nav class="mobile-nav" id="mobileNav">
  <button data-view="files" class="active">Files</button>
  <button data-view="editor">Editor</button>
</nav>
</div>
</div>

<div class="settings-pop" id="settingsPop" role="menu" aria-label="Settings" hidden>
  <div class="settings-block">
    <div class="settings-title">Storage mode</div>
    <div class="pill-group"><button id="localMode" class="active">Local</button><button id="driveMode">Google Drive</button></div>
    <div class="db-size" id="dbSize">Calculating…</div>
  </div>
  <div class="settings-block">
    <div class="settings-title">Data</div>
    <div class="settings-actions">
      <button class="raised" id="export" title="Export"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Export</span></button>
      <button class="raised" id="import" title="Import"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Import</span></button>
      <button class="raised" id="trashBtn" title="Trash"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg><span>Trash</span></button>
    </div>
  </div>
</div>

<div class="ctx-backdrop" id="ctxBackdrop"></div>
<div class="context-menu" id="contextMenu"></div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<input id="importFile" type="file" accept=".notezen,.json,.plainnote" hidden>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
